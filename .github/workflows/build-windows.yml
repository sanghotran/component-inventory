name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep incremental artifacts out of the cache: smaller cache, same speed for deps.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Test + build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Node (only for the Tauri CLI)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Tauri CLI
        run: npm ci

      # 2. Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 3. Cache ~/.cargo + target/ for every dependency crate (keyed on Cargo.lock
      #    and rustc version). Workspace crates are rebuilt each run; deps are not.
      #    Bump prefix-key (v1 -> v2) to throw the cache away on purpose.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "quanlylinhkien-v1"
          shared-key: windows
          workspaces: ". -> target"
          cache-on-failure: true

      # 4. Tauri CLI downloads NSIS and the WebView2 bootstrapper here.
      - name: Cache Tauri bundler tools (NSIS, WebView2)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            tauri-tools-${{ runner.os }}-

      # 5. Tests first: cheap, and a broken core should not spend 10 min on a build.
      - name: Test Rust core
        run: cargo test -p inventory-core

      # 6. Build app + NSIS installer
      - name: Build Tauri app
        run: npm run build

      # 7. Collect the portable exe and the installer
      # Tauri 2 keeps the cargo crate name for the exe (component-inventory.exe),
      # so pick up whatever single exe is in target/release instead of hard-coding it.
      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem target/release/*.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike '*-setup.exe' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Không tìm thấy exe trong target/release. Các exe có trong target:"
            Get-ChildItem -Recurse target -Filter *.exe | Select-Object -ExpandProperty FullName
            throw "portable exe not found"
          }
          Copy-Item $exe.FullName dist/QuanLyLinhKien-portable.exe
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          if (-not $setup) {
            Write-Host "Không tìm thấy bộ cài NSIS. Nội dung target/release/bundle:"
            Get-ChildItem -Recurse target/release/bundle -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "nsis installer not found"
          }
          Copy-Item $setup dist/
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyLinhKien-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
