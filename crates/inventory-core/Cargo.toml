[package]
name = "inventory-core"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust core for the component inventory app: data model, JSON store, Excel/CSV import and Excel export."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.38"
rust_xlsxwriter = "0.102"
csv = "1.4"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
